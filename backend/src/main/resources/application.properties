# Active profile (override via env: SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.datasource.url=${DB_URL:jdbc:h2:mem:searchdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.mhtpsd.searchengine=DEBUG
gcp.project-id=${GCP_PROJECT_ID:local-dev}
gcp.pubsub.subscription=${PUBSUB_SUBSCRIPTION:seed-urls-sub}
seed.urls=${SEED_URLS:}
