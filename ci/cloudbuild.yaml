steps:
  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/distributed-search-backend:$SHORT_SHA', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/distributed-search-backend:$SHORT_SHA']

  # Build frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/distributed-search-frontend:$SHORT_SHA', './frontend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/distributed-search-frontend:$SHORT_SHA']

  # Run Terraform init and apply (infra)
  - name: 'hashicorp/terraform:1.9.7'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        terraform -chdir=./infra/terraform init -input=false
        terraform -chdir=./infra/terraform apply -auto-approve -input=false
    env:
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

  # Deploy backend to Cloud Run (IAM-protected — no public access)
  # The backend API requires Google ID tokens for authentication.
  # Clients (e.g. the frontend service account) must present a valid ID token.
  # To grant access: gcloud run services add-iam-policy-binding search-backend \
  #   --member=serviceAccount:<client-sa>@<project>.iam.gserviceaccount.com \
  #   --role=roles/run.invoker
  # TODO: Replace <backend-sa> with the dedicated service account for the backend.
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'search-backend'
      - '--image=gcr.io/$PROJECT_ID/distributed-search-backend:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      # --service-account=<backend-sa>@$PROJECT_ID.iam.gserviceaccount.com
    env:
      - 'CLOUDSDK_CORE_PROJECT=$PROJECT_ID'

  # Deploy frontend to Cloud Run (publicly accessible — UI must be reachable without auth)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'search-frontend'
      - '--image=gcr.io/$PROJECT_ID/distributed-search-frontend:$SHORT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
    env:
      - 'CLOUDSDK_CORE_PROJECT=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/distributed-search-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/distributed-search-frontend:$SHORT_SHA'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
